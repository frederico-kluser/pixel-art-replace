[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "pixel-art-replace"
version = "0.1.0"
description = "Substitui o look de sprites/pixel art com IA — do upload à aprovação, sem partir a grelha"
readme = "README.md"
license = { file = "LICENSE" }
requires-python = ">=3.10"
dependencies = ["Pillow>=10.0", "numpy>=1.24"]

[project.scripts]
par = "par.cli:main"

[tool.setuptools.packages.find]
include = ["par*"]
